[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-fastapi-backend"
version = "0.1.0"
description = "Modular async FastAPI backend with explicit lifecycle and replaceable task dispatch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1",
  "taskiq>=0.12.6,<0.13",
  "taskiq-aio-pika>=0.6.1,<0.7",
  "redis>=8.1,<9",
  "pymongo>=4.13,<5",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.12,<1",
  "mypy>=1.15,<3",
  "pytest-cov>=7,<8",
  "build>=1.6,<2",
  "twine>=6,<7",
  "pip-audit>=2.10,<3",
  "bandit>=1.9,<2",
  "pip-tools>=7.6,<8",
]

[tool.setuptools]
py-modules = ["server", "worker", "manage"]

[tool.setuptools.packages.find]
include = ["src*", "bootstrap*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires running Redis and RabbitMQ services"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["taskiq.*", "aio_pika.*", "pamqp.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "scripts/*", "work/*", "build/*", "dist/*", "*.egg-info/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Measured against the full source tree; integration adapters stay in the denominator.
fail_under = 85

[tool.bandit]
exclude_dirs = ["tests", "work", "docs", ".venv"]
