name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "31 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: mkdir -p work/security
      # A known vulnerability in any pinned runtime/dev/build dependency blocks the check.
      # Service/index errors also fail; exclusions require a reviewed policy change.
      - run: >-
          python -m pip_audit --require-hashes --disable-pip --strict
          --cache-dir work/security/audit-cache
          -r requirements-dev.lock -r requirements-build.lock
          --format json --output work/security/dependency-audit.json
      # Medium/high severity AND medium/high confidence findings block the check.
      - run: >-
          python -m bandit -c pyproject.toml -r src bootstrap server.py worker.py manage.py
          -ll -ii --format json --output work/security/bandit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-security
          path: work/security/
          if-no-files-found: warn

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: mkdir -p work/security
      # Full fetched Git history, read-only source mount, no GitHub credentials in the container.
      - run: >-
          docker run --rm
          --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory
          --env GIT_CONFIG_VALUE_0=/repo
          --volume "$PWD:/repo:ro" --volume "$PWD/work/security:/report"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --report-format json
          --report-path /report/gitleaks.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: secret-scan
          path: work/security/gitleaks.json
          if-no-files-found: warn
